# Configuração de ESTADOS — egSYS Painel do Cliente Jira (egsys-jiraview)
#
# ⚠️ MODELO: NÃO é 1 docker por estado. Este arquivo é a configuração INTERNA
# do ÚNICO container (egsys-jiraview). Todos os estados rodam juntos aqui.
# Adicionar/remover estado = editar este arquivo (sem tocar código/infra).
#
# Estrutura por estado:
#   display_name: nome exibido
#   projects:     projetos Jira (JSM service desks) do estado
#   clientes:     gestores/clientes com acesso a este estado (RBAC scoped)
#   áreas:        abas do painel — filtros (JQL/text) por área de atendimento
#   only_reporter: se definido, filtra tickets apenas deste reporter (ex.: migração SCPMH)

estados:

  sc:
    display_name: "Santa Catarina — PMSC"
    projects: [HDPMSC]   # SCPMH desativado (espaço legado; não filtrar tasks dele)
    # Responsáveis da PM (clientes do portal) — são os únicos cujas solicitações
    # aparecem no painel do cliente por padrão (regra de negócio).
    # accountId "qm:*" = customer Atlassian (portal); os de equipe ficam de fora.
    clientes:
      - { name: "João Mário Mazzola",    accountId: "qm:5ba24cb3-ebfa-43b6-a2a8-f70ba37359e7:efe96b21-75d2-4a2b-8217-99f25ba04603", role: manager }
      - { name: "Ilclemar Vieira",       accountId: "qm:5ba24cb3-ebfa-43b6-a2a8-f70ba37359e7:09ba8e6e-ddda-438b-ac95-9a3c89ecc2e6", role: manager }
      - { name: "Alex Sandro de Oliveira", accountId: "qm:5ba24cb3-ebfa-43b6-a2a8-f70ba37359e7:77785cc8-1462-4b85-8619-a7dc4b78c643", role: manager }
      - { name: "Cap Thiesen",           accountId: "qm:5ba24cb3-ebfa-43b6-a2a8-f70ba37359e7:8860bb83-1410-4364-99a6-be3fe40244c7", role: admin }
    only_reporter: null
    áreas:
      Cidadão:     { match: ["Cidadão", "Cidadao", "CIDADAO", "PMSC Cidadão"] }
      SADE:        { match: ["SADE", "Sade"] }
      Integração:  { match: ["Integra", "integra", "Ticket"] }
      Operações:   { match: ["Operac", "operac", "Programac"] }

